# 다른 저장소의 .pre-commit-config.yaml 에서 사용:
#   repos:
#     - repo: https://github.com/kswkm/TrustChain-AI
#       rev: <commit-sha>
#       hooks:
#         - id: trustchain-check
- id: trustchain-check
  name: TrustChain AI 시큐어코딩·패키지 점검
  description: KISA 시큐어코딩 룰, 환각·타이포스쿼팅 패키지 판정, 비밀정보 탐지
  entry: trustchain check
  language: python
  pass_filenames: true
  types_or: [python, text, toml, yaml]
  require_serial: true
  # 커밋 시점과 push 직전 모두 점검 (검사를 통과해야 push 가능). 사용 저장소에서
  #   pre-commit install --hook-type pre-commit --hook-type pre-push
  stages: [pre-commit, pre-push]
  minimum_pre_commit_version: "3.2.0"
- id: trustchain-pkg-strict
  name: TrustChain AI 패키지 판정 (주의 포함 차단)
  entry: trustchain check --strict-packages
  language: python
  files: (requirements.*\.txt|pyproject\.toml)$
  pass_filenames: false
  stages: [pre-commit, pre-push]
  minimum_pre_commit_version: "3.2.0"
