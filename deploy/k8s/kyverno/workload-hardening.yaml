# F9. 워크로드 보안 설정 강제 : digest 없는 이미지·권한 상승·리소스 제한 누락 차단
# Kyverno 1.16+ CEL 기반 ValidatingPolicy (kyverno.io/v1 ClusterPolicy 의 validate.pattern 대체)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: trustchain-workload-hardening
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  # Deployment 등 워크로드 컨트롤러도 생성 시점에 검증
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [app, trustchain]
  variables:
    # 일반·초기화 컨테이너 모두 (임시 컨테이너는 리소스·권한 필드가 다르므로 이미지 digest 만 검사)
    - name: runContainers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: allImages
      expression: >-
        variables.runContainers.map(c, c.image)
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
  validations:
    - expression: "variables.allImages.all(img, img.contains('@sha256:'))"
      message: "이미지는 digest(@sha256:...)로 지정해야 합니다."
    - expression: >-
        variables.runContainers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
        && c.securityContext.allowPrivilegeEscalation == false)
        && (!has(object.spec.securityContext) || !has(object.spec.securityContext.runAsNonRoot)
        || object.spec.securityContext.runAsNonRoot == true)
      message: "allowPrivilegeEscalation: false 가 필요하고, runAsNonRoot 를 지정했다면 true 여야 합니다."
    - expression: >-
        variables.runContainers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "메모리 limit 이 필요합니다."
