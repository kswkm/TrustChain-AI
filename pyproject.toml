[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustchain-ai"
version = "0.1.0"
description = "AI 기반 SW 공급망 신뢰 검증 및 시큐어코딩 지원 플랫폼"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Team 020" }]
keywords = ["supply-chain", "sbom", "aibom", "slsa", "secure-coding", "typosquatting"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
# 코어 의존성은 최소화한다 (공급망 공격면 축소). 무거운 기능은 extras 로 분리.
dependencies = [
    "httpx>=0.27",
    "packaging>=23.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]
ai = [
    "numpy>=1.26",
    "sentence-transformers>=2.7",
    "kiwipiepy>=0.17",
    "rank-bm25>=0.2.2",
]
ml = [
    "numpy>=1.26",
    "tensorflow>=2.16",
]
dashboard = [
    "streamlit>=1.64",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "ruff>=0.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
trustchain = "trustchain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustchain = ["data/*.txt", "data/*.json", "data/*.keras", "data/*.keras.json", "data/*.sha256", "secure_coding/*.yml", "knowledge/*/*.md", "knowledge/osv/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# S603/S607: 외부 보안 도구는 shutil.which 로 찾은 절대경로 + 고정 인자 리스트로만 실행한다
ignore = ["S101", "S603", "S607", "S404", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scenarios/*" = ["S"]
